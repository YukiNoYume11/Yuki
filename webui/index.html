<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClaudeMusic</title>
<style>
  :root {
    --bg: #1F1E1D;
    --panel: #282725;
    --panel2: #2E2D2A;
    --border: #3D3B37;
    --text: #E8E6E3;
    --dim: #9C9993;
    --faint: #6B6963;
    --accent: #D97757;
    --accent-dim: #B85C3D;
    --mono: ui-monospace, "Cascadia Code", Consolas, "Courier New", monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: var(--mono); font-size: 13px;
    display: flex; flex-direction: column; overflow: hidden;
  }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  /* ===== 头部 ===== */
  header {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 16px; border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  header .logo-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
  header h1 { font-size: 14px; font-weight: 500; color: var(--text); }
  header .status { margin-left: auto; color: var(--faint); font-size: 12px; }
  header .status .ok { color: #7BAE7F; }

  /* ===== 主体 ===== */
  main { flex: 1; display: flex; min-height: 0; }
  .side {
    width: 320px; flex-shrink: 0; border-right: 1px solid var(--border);
    display: flex; flex-direction: column; min-height: 0;
  }
  .side .panel-head, .content .panel-head {
    padding: 10px 14px; color: var(--dim); font-size: 12px;
    border-bottom: 1px solid var(--border); background: var(--panel);
    letter-spacing: 0.5px;
  }
  .list { flex: 1; overflow-y: auto; }
  .item {
    padding: 10px 14px; cursor: pointer; border-bottom: 1px solid #262522;
    display: flex; align-items: center; gap: 10px;
  }
  .item:hover { background: var(--panel); }
  .item.active { background: var(--panel2); border-left: 2px solid var(--accent); }
  .item .t { flex: 1; min-width: 0; }
  .item .t .name { color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .t .sub { color: var(--faint); font-size: 11px; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .tag {
    font-size: 10px; padding: 2px 6px; border-radius: 3px; flex-shrink: 0;
    border: 1px solid var(--border); color: var(--dim);
  }
  .item .tag.live { border-color: var(--accent-dim); color: var(--accent); }

  .content { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .now-playing {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 14px; padding: 24px; position: relative;
  }
  .cover {
    width: 200px; height: 200px; border-radius: 10px;
    background: linear-gradient(135deg, #35332F, #26241F);
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    color: var(--faint); font-size: 12px; overflow: hidden;
  }
  .cover img { width: 100%; height: 100%; object-fit: cover; }
  .np-title { font-size: 17px; color: var(--text); text-align: center; }
  .np-artist { font-size: 12px; color: var(--dim); }
  .np-src { font-size: 11px; color: var(--faint); }

  /* ===== 吉祥物舞台 ===== */
  #mascot-stage { position: absolute; right: 24px; bottom: 12px; width: 260px; height: 120px; pointer-events: none; }
  #mascot {
    position: absolute; bottom: 0; left: 200px; width: 64px; height: 64px;
    transition: left .6s cubic-bezier(.4,0,.2,1), bottom .3s;
    pointer-events: none;
  }
  #mascot.playing { animation: beat 0.8s ease-in-out infinite; }
  @keyframes beat {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-8px) rotate(4deg); }
  }
  #mascot.idle { animation: float 3s ease-in-out infinite; }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
  }
  #mascot.paused svg { opacity: 0.55; }
  #bubble {
    position: absolute; bottom: 70px; background: var(--panel2);
    border: 1px solid var(--accent-dim); color: var(--text);
    padding: 6px 10px; border-radius: 8px; font-size: 11px; font-family: var(--mono);
    white-space: nowrap; opacity: 0; transition: opacity .3s; max-width: 240px;
  }
  #bubble.show { opacity: 1; }
  #bubble::after {
    content: ""; position: absolute; bottom: -5px; left: 20px;
    width: 8px; height: 8px; background: var(--panel2);
    border-right: 1px solid var(--accent-dim); border-bottom: 1px solid var(--accent-dim);
    transform: rotate(45deg);
  }
  .ui-highlight { outline: 1px solid var(--accent) !important; outline-offset: 2px; border-radius: 4px; }

  /* ===== 播放条 ===== */
  .player {
    border-top: 1px solid var(--border); background: var(--panel);
    padding: 10px 16px; flex-shrink: 0; display: flex; flex-direction: column; gap: 8px;
  }
  .progress-row { display: flex; align-items: center; gap: 10px; }
  .time { color: var(--faint); font-size: 11px; width: 84px; }
  .bar {
    flex: 1; height: 14px; display: flex; align-items: center; cursor: pointer;
  }
  .bar .track { width: 100%; height: 3px; background: var(--border); border-radius: 2px; position: relative; }
  .bar .fill { position: absolute; left: 0; top: 0; height: 100%; background: var(--accent); border-radius: 2px; width: 0%; }
  .bar .knob { position: absolute; top: 50%; transform: translate(-50%, -50%); width: 10px; height: 10px; border-radius: 50%; background: var(--accent); left: 0%; }
  .controls-row { display: flex; align-items: center; gap: 14px; }
  .btn {
    background: none; border: 1px solid var(--border); color: var(--text);
    width: 30px; height: 30px; border-radius: 6px; cursor: pointer;
    font-family: var(--mono); font-size: 13px; display: flex; align-items: center; justify-content: center;
  }
  .btn:hover { border-color: var(--accent-dim); color: var(--accent); }
  .btn.main { background: var(--accent); border-color: var(--accent); color: #1F1E1D; width: 36px; height: 36px; font-size: 15px; }
  .btn.main:hover { background: var(--accent-dim); color: #1F1E1D; }
  .np-info { flex: 1; min-width: 0; }
  .np-info .n { color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .np-info .a { color: var(--faint); font-size: 11px; margin-top: 2px; }
  .vol-wrap { display: flex; align-items: center; gap: 8px; width: 150px; }
  .vol-wrap .bar { width: 100px; }

  /* ===== 命令栏 ===== */
  .cmdline {
    border-top: 1px solid var(--border); padding: 10px 16px; flex-shrink: 0;
    display: flex; align-items: center; gap: 10px; background: var(--bg);
  }
  .cmdline .prompt { color: var(--accent); flex-shrink: 0; }
  .cmdline input {
    flex: 1; background: none; border: none; outline: none;
    color: var(--text); font-family: var(--mono); font-size: 13px;
  }
  .cmdline input::placeholder { color: var(--faint); }
  .cmd-hint { color: var(--faint); font-size: 11px; flex-shrink: 0; }
  .toast {
    position: fixed; top: 50px; left: 50%; transform: translateX(-50%);
    background: var(--panel2); border: 1px solid var(--border); color: var(--text);
    padding: 8px 14px; border-radius: 8px; font-size: 12px; font-family: var(--mono);
    opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 99;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<header>
  <div class="logo-dot"></div>
  <h1>ClaudeMusic</h1>
  <span style="color:var(--faint)">v0.1 · 私人非商用</span>
  <div class="status" id="api-status"><span class="ok">●</span> 音源: 网易云公开接口 / Radio Browser</div>
</header>

<main>
  <div class="side">
    <div class="panel-head" id="list-title">▷ 搜索结果 <span style="color:var(--faint)">— 在下方命令栏输入 play 关键词</span></div>
    <div class="list" id="result-list">
      <div class="item" style="cursor:default"><div class="t"><div class="name" style="color:var(--faint)">尚未搜索。输入 play 周杰伦 或 radio 爵士 开始</div></div></div>
    </div>
  </div>
  <div class="content">
    <div class="panel-head">▣ 正在播放</div>
    <div class="now-playing">
      <div class="cover" id="cover">无封面</div>
      <div>
        <div class="np-title" id="np-title">ClaudeMusic 就绪</div>
        <div class="np-artist" id="np-artist">在底部命令栏输入命令开始使用</div>
        <div class="np-src" id="np-src">音源: —</div>
      </div>
      <div id="mascot-stage">
        <div id="bubble"></div>
        <div id="mascot" class="idle">
          <svg viewBox="0 0 64 64" width="64" height="64">
            <g fill="#D97757">
              <rect x="29" y="2" width="6" height="16" rx="3" transform="rotate(0 32 32)"/>
              <rect x="29" y="2" width="6" height="16" rx="3" transform="rotate(30 32 32)"/>
              <rect x="29" y="2" width="6" height="16" rx="3" transform="rotate(60 32 32)"/>
              <rect x="29" y="2" width="6" height="16" rx="3" transform="rotate(90 32 32)"/>
              <rect x="29" y="2" width="6" height="16" rx="3" transform="rotate(120 32 32)"/>
              <rect x="29" y="2" width="6" height="16" rx="3" transform="rotate(150 32 32)"/>
              <rect x="29" y="2" width="6" height="16" rx="3" transform="rotate(180 32 32)"/>
              <rect x="29" y="2" width="6" height="16" rx="3" transform="rotate(210 32 32)"/>
              <rect x="29" y="2" width="6" height="16" rx="3" transform="rotate(240 32 32)"/>
              <rect x="29" y="2" width="6" height="16" rx="3" transform="rotate(270 32 32)"/>
              <rect x="29" y="2" width="6" height="16" rx="3" transform="rotate(300 32 32)"/>
              <rect x="29" y="2" width="6" height="16" rx="3" transform="rotate(330 32 32)"/>
            </g>
            <circle cx="32" cy="32" r="15" fill="#D97757" stroke="#1F1E1D" stroke-width="2"/>
            <circle cx="27" cy="30" r="2" fill="#1F1E1D"/>
            <circle cx="37" cy="30" r="2" fill="#1F1E1D"/>
            <path d="M27 37 Q32 41 37 37" stroke="#1F1E1D" stroke-width="2" fill="none" stroke-linecap="round"/>
          </svg>
        </div>
      </div>
    </div>
  </div>
</main>

<div class="player">
  <div class="progress-row" id="progress-widget">
    <span class="time" id="time-cur">0:00</span>
    <div class="bar" id="progress-bar"><div class="track"><div class="fill" id="p-fill"></div><div class="knob" id="p-knob"></div></div></div>
    <span class="time" id="time-total" style="text-align:right">0:00</span>
  </div>
  <div class="controls-row">
    <button class="btn" id="btn-prev" title="上一首">|◀</button>
    <button class="btn main" id="btn-play" title="播放/暂停">▶</button>
    <button class="btn" id="btn-next" title="下一首">▶|</button>
    <div class="np-info">
      <div class="n" id="bar-name">—</div>
      <div class="a" id="bar-artist">—</div>
    </div>
    <div class="vol-wrap" id="vol-widget">
      <span style="color:var(--faint);font-size:11px">VOL</span>
      <div class="bar" id="vol-bar"><div class="track"><div class="fill" id="v-fill" style="width:80%"></div><div class="knob" id="v-knob" style="left:80%"></div></div></div>
      <span style="color:var(--faint);font-size:11px" id="vol-num">80</span>
    </div>
  </div>
</div>

<div class="cmdline">
  <span class="prompt">&gt;</span>
  <input id="cmd" type="text" placeholder="输入命令: play 周杰伦 | radio 爵士 | next | pause | vol 50 | help" autocomplete="off">
  <span class="cmd-hint">Enter 执行</span>
</div>

<audio id="audio"></audio>
<div class="toast" id="toast"></div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const audio = $("audio");

/* ==================== 状态 ==================== */
const state = {
  queue: [], cur: -1, playing: false, seekable: false,
  vol: 0.8, source: "",
};

/* ==================== 内置演示曲库（实测可播的网易云免费曲目） ==================== */
const DEMO_TRACKS = [
  { id: 400876427, name: "Try", artist: "周杰伦", album: "功夫熊猫3 主题曲", outer: "https://music.163.com/song/media/outer/url?id=400876427.mp3" },
  { id: 288750, name: "山歌好比春江水.多谢了 (Live)", artist: "李健", album: "歌手", outer: "https://music.163.com/song/media/outer/url?id=288750.mp3" },
  { id: 288820, name: "结尾曲 - 友谊地久天长 (Live)", artist: "群星", album: "歌手", outer: "https://music.163.com/song/media/outer/url?id=288820.mp3" },
];

/* ==================== 工具 ==================== */
function fmt(s) { s = Math.max(0, Math.floor(s || 0)); return Math.floor(s/60) + ":" + String(s%60).padStart(2,"0"); }
function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2200);
}
function esc(s) { const d = document.createElement("div"); d.textContent = s || ""; return d.innerHTML; }

/* ==================== 吉祥物 ==================== */
const mascot = $("mascot"), bubble = $("bubble");
let bubbleTimer = null, mascotHome = 200;

function say(text, ms) {
  bubble.textContent = text; bubble.classList.add("show");
  clearTimeout(bubbleTimer);
  bubbleTimer = setTimeout(() => bubble.classList.remove("show"), ms || 3200);
}
function mascotSet(mode) {
  mascot.classList.remove("playing", "idle", "paused");
  mascot.classList.add(mode);
}
function mascotGoto(el, text) {
  const stage = $("mascot-stage").getBoundingClientRect();
  const r = el.getBoundingClientRect();
  const x = Math.max(0, Math.min(190, r.left + r.width/2 - stage.left - 32));
  mascot.style.left = x + "px";
  if (text) say(text);
  el.classList.add("ui-highlight");
  setTimeout(() => el.classList.remove("ui-highlight"), 2600);
  setTimeout(() => { mascot.style.left = mascotHome + "px"; }, 2600);
}

/* ==================== 播放核心 ==================== */
function setPlayingUI(on) {
  state.playing = on;
  $("btn-play").textContent = on ? "❚❚" : "▶";
  mascotSet(on ? "playing" : "paused");
  if (!on) say("先歇一会儿…");
}

function loadTrack(i) {
  if (!state.queue.length) return;
  state.cur = (i + state.queue.length) % state.queue.length;
  const t = state.queue[state.cur];
  state.seekable = !!t.outer;
  audio.src = t.outer || t.url || t.url_resolved;
  audio.volume = state.vol;
  audio.play().catch(() => {});
  document.querySelectorAll(".item").forEach(el => el.classList.remove("active"));
  const rows = document.querySelectorAll("#result-list .item");
  if (rows[state.cur]) rows[state.cur].classList.add("active");
  $("np-title").textContent = t.name;
  $("np-artist").textContent = t.artist || t.country || "";
  $("np-src").textContent = "音源: " + (t.outer ? "网易云" : "Radio Browser");
  $("cover").innerHTML = t.pic ? '<img src="' + esc(t.pic) + '" onerror="this.remove()">' : (t.outer ? "♪" : "LIVE");
  $("bar-name").textContent = t.name;
  $("bar-artist").textContent = t.artist || t.country || "";
  say("正在播放: " + t.name);
}

audio.addEventListener("playing", () => setPlayingUI(true));
audio.addEventListener("pause", () => { if (!audio.ended) setPlayingUI(false); });
audio.addEventListener("ended", () => { if (state.queue.length) loadTrack(state.cur + 1); });
audio.addEventListener("error", () => {
  if (!audio.src) return;
  say("这首可能是 VIP 曲目，登录后可解锁，先试试电台模式");
  toast("该曲目需要登录/会员权限");
});
audio.addEventListener("timeupdate", () => {
  if (!state.seekable || !audio.duration) return;
  const p = audio.currentTime / audio.duration * 100;
  $("p-fill").style.width = p + "%"; $("p-knob").style.left = p + "%";
  $("time-cur").textContent = fmt(audio.currentTime);
  $("time-total").textContent = fmt(audio.duration);
});

/* ==================== 搜索（网易云公开接口 → 失败自动降级演示曲库） ==================== */
async function neteaseSearch(q) {
  try {
    const url = "https://music.163.com/api/search/get?s=" + encodeURIComponent(q) + "&type=1&limit=25";
    const r = await fetch(url, { signal: AbortSignal.timeout(6000) });
    const d = await r.json();
    const songs = (d.result && d.result.songs) || [];
    return songs.map(s => ({
      id: s.id, name: s.name,
      artist: (s.artists || []).map(a => a.name).join("/"),
      album: s.album ? s.album.name : "",
      pic: s.album && s.album.picUrl ? s.album.picUrl : "",
      outer: "https://music.163.com/song/media/outer/url?id=" + s.id + ".mp3",
    }));
  } catch (e) {
    return null; // CORS 或网络不可达 → 调用方降级
  }
}

async function radioSearch(q) {
  try {
    const url = "https://de1.api.radio-browser.info/json/stations/search?name=" + encodeURIComponent(q) + "&limit=15&hidebroken=true&order=votes&reverse=true";
    const r = await fetch(url, { signal: AbortSignal.timeout(6000) });
    return (await r.json()).map(s => ({
      rid: s.stationuuid, name: s.name.trim(), artist: s.country + " · " + (s.tags || "").split(",").slice(0,2).join("/"),
      url: s.url_resolved || s.url, country: s.country,
    }));
  } catch (e) { return []; }
}

function renderList(list, isRadio) {
  $("list-title").innerHTML = isRadio
    ? '▷ 电台结果 <span style="color:var(--faint)">— Radio Browser 实时数据</span>'
    : '▷ 搜索结果 <span style="color:var(--faint)">— 网易云曲库</span>';
  $("result-list").innerHTML = list.map((t, i) =>
    '<div class="item" data-i="' + i + '">' +
      '<div class="t"><div class="name">' + esc(t.name) + '</div>' +
      '<div class="sub">' + esc(t.artist || t.country || "") + (t.album ? " · " + esc(t.album) : "") + '</div></div>' +
      '<span class="tag' + (isRadio ? " live" : "") + '">' + (isRadio ? "LIVE" : (t.vipHint ? "VIP?" : "MP3")) + '</span>' +
    '</div>').join("");
  document.querySelectorAll("#result-list .item").forEach(el =>
    el.addEventListener("click", () => loadTrack(+el.dataset.i)));
}

async function doPlay(q) {
  toast("搜索中: " + q);
  const songs = await neteaseSearch(q);
  if (songs && songs.length) {
    state.queue = songs; renderList(songs, false); loadTrack(0); return;
  }
  // 降级：演示曲库匹配 + 电台
  const demo = DEMO_TRACKS.filter(t => (t.name + t.artist).toLowerCase().includes(q.toLowerCase()));
  const radios = await radioSearch(q);
  if (radios.length) {
    state.queue = radios; renderList(radios, true); loadTrack(0);
    say(songs === null ? "浏览器直连受限，已切电台模式；Tauri 版可解锁完整网易云" : "没找到歌曲，为你找到相关电台");
  } else if (demo.length) {
    state.queue = demo; renderList(demo, false); loadTrack(0);
  } else {
    say("没找到「" + q + "」相关内容"); toast("无结果");
  }
}

async function doRadio(q) {
  toast("搜索电台: " + q);
  const radios = await radioSearch(q);
  if (!radios.length) { say("没找到相关电台"); return; }
  state.queue = radios; renderList(radios, true); loadTrack(0);
}

/* ==================== 进度/音量条 ==================== */
function bindBar(barEl, cb) {
  const apply = (e) => {
    const r = barEl.getBoundingClientRect();
    cb(Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)));
  };
  barEl.addEventListener("mousedown", (e) => {
    apply(e);
    const mv = (ev) => apply(ev);
    const up = () => { document.removeEventListener("mousemove", mv); document.removeEventListener("mouseup", up); };
    document.addEventListener("mousemove", mv); document.addEventListener("mouseup", up);
  });
}
bindBar($("progress-bar"), (p) => {
  if (state.seekable && audio.duration) audio.currentTime = p * audio.duration;
  mascotGoto($("progress-widget"), "拖到 " + fmt(p * (audio.duration || 0)));
});
function setVol(v) {
  state.vol = Math.max(0, Math.min(1, v));
  audio.volume = state.vol;
  const p = state.vol * 100;
  $("v-fill").style.width = p + "%"; $("v-knob").style.left = p + "%"; $("vol-num").textContent = Math.round(p);
}
bindBar($("vol-bar"), (p) => { setVol(p); mascotGoto($("vol-widget"), "音量 " + Math.round(p*100) + "%"); });

/* ==================== 控制按钮 ==================== */
$("btn-play").addEventListener("click", () => {
  if (!audio.src) { execCmd("play 热门华语"); return; }
  if (audio.paused) { audio.play().catch(()=>{}); say("继续播放~"); } else { audio.pause(); }
});
$("btn-next").addEventListener("click", () => { if (state.queue.length) { loadTrack(state.cur + 1); mascotGoto($("btn-next")); } });
$("btn-prev").addEventListener("click", () => { if (state.queue.length) { loadTrack(state.cur - 1); mascotGoto($("btn-prev")); } });

/* ==================== 命令解析 ==================== */
function help() {
  say("命令: play <关键词> · radio <名称> · next · prev · pause · vol 0-100 · demo · help");
  toast("play/radio/next/prev/pause/vol/demo/help");
}
function execCmd(raw) {
  const s = raw.trim(); if (!s) return;
  const [cmd, ...rest] = s.split(/\s+/); const arg = rest.join(" ");
  switch (cmd.toLowerCase()) {
    case "play": arg ? doPlay(arg) : say("用法: play <关键词>"); break;
    case "radio": arg ? doRadio(arg) : doRadio("华语"); break;
    case "next": $("btn-next").click(); break;
    case "prev": $("btn-prev").click(); break;
    case "pause": audio.pause(); break;
    case "resume": audio.play().catch(()=>{}); break;
    case "vol": { const v = parseFloat(arg); if (!isNaN(v)) { setVol(v/100); mascotGoto($("vol-widget"), "音量 " + Math.round(Math.min(100,Math.max(0,v))) + "%"); } break; }
    case "demo": state.queue = DEMO_TRACKS.slice(); renderList(DEMO_TRACKS, false); loadTrack(0); break;
    case "help": help(); break;
    default: doPlay(s); // 非命令输入直接当搜索
  }
}
$("cmd").addEventListener("keydown", (e) => {
  if (e.key === "Enter") { execCmd(e.target.value); e.target.value = ""; }
});

/* 启动问候 */
setTimeout(() => say("嗨，我是 Claude！输入 play 关键词开始听歌"), 800);
</script>
