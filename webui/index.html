<!DOCTYPE html>
<html lang="zh-CN" data-mood="calm">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClaudeMusic — claude — 120×40</title>
<style>
  :root {
    --bg: #191817; --win: #1F1E1D; --panel: #262522; --panel2: #2C2B28;
    --border: #3A3833; --text: #E8E6E3; --dim: #9C9993; --faint: #6B6963;
    --accent: #D97757; --accent-dim: #B85C3D; --accent-dark: #8F4527;
    --k1: #E8A87C; --k2: #E86A5E; --k3: #9AB8D8; --ok: #7BAE7F;
    --mono: ui-monospace, "Cascadia Code", Consolas, "Courier New", monospace;
  }
  html[data-mood="excited"] { --accent: #E8825C; }
  html[data-mood="peak"] { --accent: #F2906A; --k2: #FF5540; }
  html[data-mood="calm"] { --accent: #D97757; }
  html[data-mood="melancholy"] { --accent: #7E8CA0; --k1: #9FB4CC; --k2: #7A8CA8; --k3: #62778F; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #0D0C0B; color: var(--text); font-family: var(--mono); font-size: 13px;
    display: flex; align-items: stretch; justify-content: center; padding: 14px;
  }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  /* ===== 终端窗口 ===== */
  .term {
    flex: 1; max-width: 1080px; display: flex; flex-direction: column;
    background: var(--win); border: 1px solid #44413B; border-radius: 10px; overflow: hidden;
  }
  .titlebar {
    display: flex; align-items: center; padding: 8px 12px; gap: 8px;
    background: #232220; border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .dot.r { background: #FF5F57; } .dot.y { background: #FEBC2E; } .dot.g { background: #28C840; }
  .titlebar .t { flex: 1; text-align: center; color: var(--dim); font-size: 12px; }

  .term-body { flex: 1; display: flex; flex-direction: column; padding: 14px 18px 10px; min-height: 0; }

  /* ===== 欢迎框（Claude Code 同款） ===== */
  .welcome {
    border: 1.5px solid var(--accent); border-radius: 12px;
    padding: 14px 18px; display: flex; align-items: center; gap: 20px;
    flex-shrink: 0; background: rgba(217,119,87,.04);
  }
  .welcome .mascot-box { flex-shrink: 0; }
  .welcome h1 { font-size: 22px; font-weight: 500; letter-spacing: .5px; color: var(--text); }
  .welcome .meta { color: var(--dim); font-size: 13px; margin-top: 4px; }
  .welcome .path { color: var(--faint); font-size: 13px; margin-top: 2px; }
  .welcome .right { margin-left: auto; text-align: right; color: var(--faint); font-size: 11px; line-height: 1.9; flex-shrink: 0; }
  .welcome .right b { color: var(--accent); font-weight: 500; }

  /* ===== 像素吉祥物（Claude Code 小螃蟹同款） ===== */
  .mascot { display: inline-block; position: relative; }
  .mascot .armL, .mascot .armR, .mascot .legL, .mascot .legR { transition: transform .15s; }
  .mascot[data-anim="idle"] .body { animation: bob 2.6s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-1px); } }
  .mascot[data-anim="dance"] .armL { animation: wvL .38s ease-in-out infinite alternate; transform-origin: 6px 8px; }
  .mascot[data-anim="dance"] .armR { animation: wvR .38s ease-in-out infinite alternate; transform-origin: 14px 8px; }
  .mascot[data-anim="dance"] .legL { animation: stL .38s ease-in-out infinite alternate; transform-origin: 8px 12px; }
  .mascot[data-anim="dance"] .legR { animation: stR .38s ease-in-out infinite alternate; transform-origin: 12px 12px; }
  .mascot[data-anim="dance"] .body { animation: hop .38s ease-in-out infinite alternate; }
  @keyframes wvL { from { transform: rotate(0); } to { transform: rotate(-40deg); } }
  @keyframes wvR { from { transform: rotate(0); } to { transform: rotate(40deg); } }
  @keyframes stL { from { transform: translateY(0); } to { transform: translateY(-1.2px) rotate(-16deg); } }
  @keyframes stR { from { transform: translateY(-1.2px) rotate(16deg); } to { transform: translateY(0); } }
  @keyframes hop { from { transform: translateY(0); } to { transform: translateY(-1.6px); } }
  .mascot[data-anim="sleep"] .eye { transform: scaleY(.12); }
  .mascot[data-anim="sleep"] .body { animation: bob 4s ease-in-out infinite; }
  .zzz { position: absolute; top: -8px; right: -12px; color: var(--k3); font-size: 11px; opacity: 0; }
  .mascot[data-anim="sleep"] .zzz { opacity: 1; animation: zf 2s ease-in-out infinite; }
  @keyframes zf { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(-10px); opacity: 0; } }

  /* ===== 输出区（终端流） ===== */
  .out { flex: 1; overflow-y: auto; padding: 12px 4px 6px; min-height: 0; position: relative; }
  .ln { line-height: 1.75; white-space: pre-wrap; word-break: break-all; }
  .ln .p { color: var(--accent); }
  .ln.dim { color: var(--faint); }
  .ln.ok { color: var(--ok); }
  .ln.err { color: #E86A5E; }
  .row { cursor: pointer; padding: 1px 8px; margin: 0 -8px; border-radius: 4px; display: flex; gap: 10px; align-items: baseline; }
  .row:hover { background: var(--panel); }
  .row.on { background: var(--panel2); }
  .row .idx { color: var(--faint); flex-shrink: 0; width: 26px; text-align: right; }
  .row .nm { color: var(--text); }
  .row.on .nm { color: var(--accent); }
  .row .ar { color: var(--faint); font-size: 12px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .tg { color: var(--faint); font-size: 11px; flex-shrink: 0; }
  .row .tg.live { color: var(--accent); }

  /* 歌词大字行（终端内 MV） */
  .lyric-line {
    text-align: center; font-size: 26px; font-weight: 500; letter-spacing: 2px;
    padding: 18px 0 10px; color: var(--text);
  }
  .lyric-line .k1 { color: var(--k1); }
  .lyric-line .k2 { color: var(--k2); background: rgba(217,119,87,.12); padding: 0 6px; border-radius: 4px; }
  .lyric-line .k3 { color: var(--k3); }
  html[data-mood="excited"] .lyric-line, html[data-mood="peak"] .lyric-line { animation: bin .4s cubic-bezier(.2,1.6,.4,1); }
  html[data-mood="peak"] .lyric-line .k2 { display: inline-block; animation: kw .5s ease-in-out infinite alternate; }
  html[data-mood="calm"] .lyric-line { animation: fin .8s ease; }
  html[data-mood="melancholy"] .lyric-line { animation: flo 1.5s ease; font-size: 22px; }
  @keyframes bin { 0% { transform: scale(.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  @keyframes fin { from { transform: translateY(12px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  @keyframes flo { from { transform: translateY(26px); opacity: 0; letter-spacing: 6px; } to { transform: translateY(0); opacity: 1; letter-spacing: 2px; } }
  @keyframes kw { from { transform: rotate(-2deg) scale(1); } to { transform: rotate(2deg) scale(1.07); } }

  /* 频谱条（MV 终端底部同款） */
  .eq { position: absolute; left: 0; right: 0; bottom: 0; height: 42px; display: flex; align-items: flex-end; gap: 3px; opacity: .5; pointer-events: none; }
  .eq i { flex: 1; background: var(--accent); border-radius: 1px 1px 0 0; height: 6%; min-width: 2px; transition: height .08s linear; }

  /* ===== 播放条 ===== */
  .player { flex-shrink: 0; padding: 4px 0 8px; }
  .prow { display: flex; align-items: center; gap: 10px; }
  .btn {
    background: none; border: 1px solid var(--border); color: var(--text);
    width: 26px; height: 26px; border-radius: 6px; cursor: pointer;
    font-family: var(--mono); font-size: 11px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .btn:hover { border-color: var(--accent-dim); color: var(--accent); }
  .btn.main { background: var(--accent); border-color: var(--accent); color: #1F1E1D; }
  .pbar { flex: 1; height: 12px; display: flex; align-items: center; cursor: pointer; }
  .pbar .tr { width: 100%; height: 3px; background: var(--border); border-radius: 2px; position: relative; }
  .pbar .fl { position: absolute; left: 0; top: 0; height: 100%; background: var(--accent); width: 0%; border-radius: 2px; }
  .tm { color: var(--faint); font-size: 11px; width: 80px; }
  .np { color: var(--dim); font-size: 12px; max-width: 300px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .np b { color: var(--text); font-weight: 500; }
  .vol { display: flex; align-items: center; gap: 6px; width: 130px; flex-shrink: 0; }
  .vol .pbar { width: 80px; flex: none; }
  .vol .lb { color: var(--faint); font-size: 10px; }

  /* ===== 命令行（> █） ===== */
  .cmdline { flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 8px 2px; }
  .cmdline .p { color: var(--accent); font-size: 15px; flex-shrink: 0; }
  .cmdline input {
    flex: 1; background: none; border: none; outline: none;
    color: var(--text); font-family: var(--mono); font-size: 14px; caret-color: transparent;
  }
  .cursor {
    width: 9px; height: 17px; background: var(--accent); flex-shrink: 0;
    animation: blink 1.06s step-end infinite; margin-left: -4px;
  }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }

  /* ===== 底部提示行（› › 同款） ===== */
  .statusbar {
    flex-shrink: 0; display: flex; align-items: center; gap: 14px;
    padding: 7px 2px 2px; color: var(--faint); font-size: 11.5px; border-top: 1px solid #26251F;
  }
  .statusbar .arrows { color: var(--dim); letter-spacing: 2px; }
  .statusbar b { color: var(--accent); font-weight: 500; }
  .statusbar .right { margin-left: auto; }
</style>
</head>
<body>
<div class="term">
  <div class="titlebar">
    <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
    <span class="t">你 — claudemusic — 120×40</span>
  </div>

  <div class="term-body">
    <div class="welcome">
      <span class="mascot-box">
        <span class="mascot" id="mascot" data-anim="idle">
          <span class="zzz">z Z</span>
          <svg viewBox="0 0 20 16" width="72" height="58" shape-rendering="crispEdges">
            <g class="body">
              <g fill="#D97757">
                <rect x="3" y="2" width="14" height="10"/>
                <rect x="2" y="3" width="16" height="8"/>
                <rect x="4" y="1" width="12" height="12"/>
              </g>
              <g fill="#B85C3D"><rect x="3" y="10" width="14" height="2"/><rect x="4" y="11" width="12" height="1"/></g>
              <g class="eye" fill="#2A1710"><rect x="6.5" y="5" width="2" height="2.4"/><rect x="11.5" y="5" width="2" height="2.4"/></g>
              <g class="armL" fill="#C4633F"><rect x="0.5" y="6" width="2.5" height="2.4"/></g>
              <g class="armR" fill="#C4633F"><rect x="17" y="6" width="2.5" height="2.4"/></g>
              <g class="legL" fill="#B85C3D"><rect x="6" y="12" width="2.4" height="2.6"/></g>
              <g class="legR" fill="#B85C3D"><rect x="11.6" y="12" width="2.4" height="2.6"/></g>
            </g>
          </svg>
        </span>
      </span>
      <div>
        <h1>ClaudeMusic</h1>

    <div class="out" id="out">

      <div class="eq" id="eq"></div>
    </div>

    <div class="player">
      <div class="prow" id="progress-widget">
        <button class="btn" id="btn-prev" title="上一首">|◀</button>
        <button class="btn main" id="btn-play" title="播放/暂停">▶</button>
        <button class="btn" id="btn-next" title="下一首">▶|</button>
        <span class="np" id="np-line">未在播放</span>
        <div class="pbar" id="progress-bar"><div class="tr"><div class="fl" id="p-fill"></div></div></div>

          <span class="lb">VOL</span>
          <div class="pbar" id="vol-bar"><div class="tr"><div class="fl" id="v-fill" style="width:80%"></div></div></div>
          <span class="lb" id="vol-num">80</span>
        </div>
      </div>
    </div>

    <div class="cmdline">
      <span class="p">&gt;</span>
      <input id="cmd" type="text" autocomplete="off" spellcheck="false" aria-label="命令输入">

    <div class="statusbar">
      <span class="arrows">› ›</span>
      <span>mood auto on (<b>m</b> 循环切换)</span>
      <span>play &lt;词&gt; · radio &lt;名&gt; · demo · clear</span>
      <span class="right" id="mood-desc">情绪驱动歌词与交互 · shift+enter 待用</span>
    </div>
  </div>
</div>

<audio id="audio"></audio>
<script>
/* ==================== Tauri 桥接层 ==================== */
/* 在 Tauri 中: 网易云请求走 proxy.localhost 自定义协议(同源+ACAO),
   使 fetch 不受 CORS 限制、Web Audio AnalyserNode 不被跨域污染 */
(function () {
  const IS_TAURI = !!(window.__TAURI_INTERNALS__ || window.__TAURI__);
  const NETEASE_RE = /music\.163\.com|126\.net/;
  if (IS_TAURI) {
    const P = "http://proxy.localhost/?u=";
    const origFetch = window.fetch.bind(window);
    window.fetch = function (input, init) {
      const u = typeof input === "string" ? input : input && input.url;
      if (u && NETEASE_RE.test(u)) return origFetch(P + encodeURIComponent(u), init);
      if (u && /qq\.com/.test(u)) return origFetch(P + encodeURIComponent(u), init);
      return origFetch(input, init);
    };
    window.__CM_PROXY__ = function (u) {
      return NETEASE_RE.test(u) ? P + encodeURIComponent(u) : u;
    };
    document.documentElement.dataset.env = "tauri";
  } else {
    document.documentElement.dataset.env = "browser";
  }
  window.__CM_IS_TAURI__ = IS_TAURI;
})();
</script>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const audio = $("audio");
const state = { queue: [], cur: -1, seekable: false, vol: 0.8, playing: false };

/* ==================== 终端输出 ==================== */
const out = $("out");
function echo(html, cls) {
  const d = document.createElement("div");
  d.className = "ln" + (cls ? " " + cls : "");
  d.innerHTML = html;
  out.insertBefore(d, $("eq"));
  out.scrollTop = out.scrollHeight;
}
function esc(s) { const d = document.createElement("div"); d.textContent = s || ""; return d.innerHTML; }
function toastLike(msg, cls) { echo("<span class='p'>⏺</span> " + esc(msg), cls || "dim"); }

/* ==================== 吉祥物 ==================== */
const mascot = $("mascot");
function mascotAnim(a) { mascot.dataset.anim = a; }
mascot.addEventListener("click", () => {
  const lines = ["在听在听~", "这首歌不错吧！", "换歌就喊我", "♪ ♫ ♬", "戳我干嘛，好好听歌"];
  echo("<span class='p'>Claude:</span> " + esc(lines[Math.floor(Math.random() * lines.length)]));
});

/* ==================== 时钟 ==================== */
setInterval(() => { $("clock").textContent = new Date().toTimeString().slice(0, 8); }, 1000);

/* ==================== 字幕引擎（LRC 歌词工具） ==================== */
/* 内置工具: fetchLrc(网易云歌词) / parseLrc(LRC解析) / colorize(关键词分色)
   / syncLrc(逐行同步渲染)。浏览器直连受限时自动降级为演示文案。 */
const DEMO_LYRICS = [
  "落日 把云朵 烫成了 <b class='k1'>橘色</b>",
  "你像 <b class='k1'>一阵风</b> 吹散了 <b class='k2'>烦恼</b>",
  "心跳的节拍 是 我的 <b class='k2'>鼓点</b>",
  "把 世界 调成 <b class='k1'>亮色</b>",
  "晚风 轻轻 哼着 <b class='k3'>歌</b>",
  "星星 排好队 为你 <b class='k2'>闪烁</b>",
];
let lyricMode = true, lrcLines = [], lrcPtr = 0, lyricIdx = 0, lyricTimer = null, lyricEl = null;

async function fetchLrc(id) {
  try {
    const r = await fetch("https://music.163.com/api/song/lyric?id=" + id + "&lv=1&kv=1&tv=-1", { signal: AbortSignal.timeout(6000) });
    const d = await r.json();
    return d.lrc && d.lrc.lyric ? d.lrc.lyric : null;
  } catch (e) { return null; }
}
function parseLrc(text) {
  const arr = [];
  for (const line of text.split(/\r?\n/)) {
    const m = line.match(/^\s*\[(\d{1,2}):(\d{1,2}(?:\.\d{1,3})?)\](.*)$/);
    if (m && m[3].replace(/<[^>]*>/g, "").trim()) {
      arr.push({ t: (+m[1]) * 60 + parseFloat(m[2]), text: m[3].replace(/<[^>]*>/g, "").trim() });
    }
  }
  return arr.sort((a, b) => a.t - b.t);
}
function colorize(text) {
  const toks = text.split(/(\s+)/);
  let ci = 0;
  return toks.map(tok => {
    if (!tok || /^\s+$/.test(tok)) return esc(tok);
    const clean = tok.replace(/[^\u4e00-\u9fa5A-Za-z0-9]/g, "");
    if (clean.length < 2) return esc(tok);
    return "<b class='" + ["k1", "k2", "k3"][ci++ % 3] + "'>" + esc(tok) + "</b>";
  }).join("");
}
function renderLrcLine(text) {
  if (lyricEl) { lyricEl.remove(); lyricEl = null; }
  if (!lyricMode || !text) return;
  lyricEl = document.createElement("div");
  lyricEl.className = "lyric-line";
  lyricEl.innerHTML = text.indexOf("<b") >= 0 ? text : colorize(text);
  out.insertBefore(lyricEl, $("eq"));
  out.scrollTop = out.scrollHeight;
}
function syncLrc() {
  if (!lrcLines.length || !state.seekable || !state.playing) return;
  const t = audio.currentTime + 0.25;
  if (lrcPtr >= lrcLines.length) return;
  if (lrcLines[lrcPtr].t <= t) {
    while (lrcPtr + 1 < lrcLines.length && lrcLines[lrcPtr + 1].t <= t) lrcPtr++;
    renderLrcLine(lrcLines[lrcPtr].text);
    lrcPtr++;
  }
}
function nextLyric() {
  renderLrcLine(DEMO_LYRICS[lyricIdx % DEMO_LYRICS.length]);
  lyricIdx++;
}
async function startLyrics(track) {
  stopLyrics();
  lrcLines = []; lrcPtr = 0;
  if (track && track.id && lyricMode) {
    const lrc = await fetchLrc(track.id);
    if (lrc) lrcLines = parseLrc(lrc);
  }
  if (lrcLines.length) {
    toastLike("已加载逐行歌词 " + lrcLines.length + " 行", "ok");
    renderLrcLine(lrcLines[0].text); lrcPtr = 1;
  } else {
    nextLyric();
    lyricTimer = setInterval(() => { if (state.playing) nextLyric(); }, 4200);
  }
}
function stopLyrics() {
  clearInterval(lyricTimer); lyricTimer = null;
  if (lyricEl) { lyricEl.remove(); lyricEl = null; }
}

/* ==================== 情绪引擎 ==================== */
const MOODS = {
  excited: { name: "欢快", anim: "dance" }, peak: { name: "高潮", anim: "dance" },
  calm: { name: "平静", anim: "idle" }, melancholy: { name: "忧郁", anim: "sleep" },
};
const MOOD_KEYS = ["auto", "excited", "peak", "calm", "melancholy"];
let moodAuto = true, moodCur = "calm", analyser = null, audioCtx = null, tainted = false;
let tdBuf, fqBuf, fluxHist = [], synthPhase = 0;

function initAnalyser() {
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const src = audioCtx.createMediaElementSource(audio);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    src.connect(analyser); analyser.connect(audioCtx.destination);
    tdBuf = new Uint8Array(analyser.fftSize);
    fqBuf = new Uint8Array(analyser.frequencyBinCount);
  } catch (e) { tainted = true; }
}
audio.addEventListener("play", () => { if (audioCtx && audioCtx.state === "suspended") audioCtx.resume(); });

function setMood(key, srcLabel) {
  if (!MOODS[key] || key === moodCur) return;
  moodCur = key;
  document.documentElement.dataset.mood = key;
  $("mood-name").textContent = MOODS[key].name;
  $("mood-src").textContent = srcLabel || "";
  $("mood-desc").textContent = "当前情绪「" + MOODS[key].name + "」正在驱动歌词与交互";
  mascotAnim(state.playing ? MOODS[key].anim : "sleep");
  const hello = { excited: "节奏起来了！", peak: "副歌！跟我摇~", calm: "嗯…慢慢听~", melancholy: "这首有点伤感，我陪你" };
  echo("<span class='p'>Claude:</span> " + hello[key], "dim");
}
function classify(rms, centroid, onsets) {
  let key;
  if (rms > 0.55 && onsets > 4) key = "peak";
  else if (rms > 0.3 && centroid > 0.22 && onsets > 1.5) key = "excited";
  else if (rms < 0.18 && centroid < 0.18) key = "melancholy";
  else key = "calm";
  if (key !== moodCur && moodAuto) setMood(key, "(实时)");
}
function drawEQ(fq) {
  const step = Math.floor(fq.length / eqEls.length);
  for (let i = 0; i < eqEls.length; i++) {
    let v = 0;
    for (let j = 0; j < step; j++) v = Math.max(v, fqBuf[i * step + j]);
    eqEls[i].style.height = Math.max(6, v / 255 * 100) + "%";
  }
}
function moodLoop() {
  if (state.playing && analyser && !tainted) {
    analyser.getByteTimeDomainData(tdBuf);
    analyser.getByteFrequencyData(fqBuf);
    let sum = 0, allZero = true;
    for (let i = 0; i < tdBuf.length; i++) { const v = (tdBuf[i] - 128) / 128; sum += v * v; if (tdBuf[i] !== 128 && tdBuf[i] !== 0) allZero = false; }
    const rms = Math.sqrt(sum / tdBuf.length);
    let wsum = 0, fsum = 0;
    for (let i = 0; i < fqBuf.length; i++) { wsum += fqBuf[i] * i; fsum += fqBuf[i]; }
    const centroid = fsum > 0 ? wsum / fsum / fqBuf.length : 0;
    fluxHist.push(rms); if (fluxHist.length > 43) fluxHist.shift();
    const onsets = fluxHist.filter((v, i, a) => i > 0 && v - a[i-1] > 0.02).length / (fluxHist.length / 20);
    if (allZero && rms < 0.001) tainted = true;
    else { classify(rms, centroid, onsets); drawEQ(fqBuf); }
  }
  if (state.playing && (tainted || !analyser)) {
    synthPhase += 0.09;
    const rms = 0.25 + 0.2 * Math.abs(Math.sin(synthPhase)) + 0.1 * Math.sin(synthPhase * 0.37);
    const centroid = 0.3 + 0.15 * Math.sin(synthPhase * 0.23);
    const onsets = 2 + 2 * Math.abs(Math.sin(synthPhase * 0.5));
    $("mood-src").textContent = "(模拟)";
    classify(rms, centroid, onsets);
    for (let i = 0; i < eqEls.length; i++) eqEls[i].style.height = Math.max(6, (Math.abs(Math.sin(synthPhase + i * 0.4)) * 70 + 8)) + "%";
  }
  requestAnimationFrame(moodLoop);
}
const eqEls = [];
for (let i = 0; i < 30; i++) { const b = document.createElement("i"); $("eq").appendChild(b); eqEls.push(b); }
setInterval(() => { if (!state.playing) eqEls.forEach(b => b.style.height = "6%"); }, 300);
initAnalyser();
moodLoop();

/* ==================== 播放核心 ==================== */
function setPlayingUI(on) {
  state.playing = on;
  $("btn-play").textContent = on ? "❚❚" : "▶";
  mascotAnim(on ? MOODS[moodCur].anim : "sleep");
  if (on) startLyrics(); else { stopLyrics(); }
}
function fmt(s) { s = Math.max(0, Math.floor(s || 0)); return Math.floor(s/60) + ":" + String(s%60).padStart(2,"0"); }
function loadTrack(i) {
  if (!state.queue.length) return;
  state.cur = (i + state.queue.length) % state.queue.length;
  const t = state.queue[state.cur];
  state.seekable = !!t.outer;
  const rawUrl = t.outer || t.url || t.url_resolved;
  if (window.__CM_PROXY__ && /music\.163\.com|126\.net/.test(rawUrl)) {
    audio.crossOrigin = "anonymous";
    audio.src = window.__CM_PROXY__(rawUrl);
  } else {
    audio.crossOrigin = null;
    audio.src = rawUrl;
  }
  audio.volume = state.vol;
  audio.play().catch(() => {});
  document.querySelectorAll(".row").forEach(el => el.classList.remove("on"));
  const rows = document.querySelectorAll("#out .row");
  if (rows[state.cur]) { rows[state.cur].classList.add("on"); rows[state.cur].scrollIntoView({ block: "nearest" }); }
  $("np-line").innerHTML = "<b>" + esc(t.name) + "</b> — " + esc(t.artist || t.country || "");
  echo("<span class='p'>▶</span> 正在播放: <b>" + esc(t.name) + "</b> — " + esc(t.artist || t.country || ""), "");
  startLyrics(t);
}
audio.addEventListener("playing", () => setPlayingUI(true));
audio.addEventListener("pause", () => { if (!audio.ended) { state.playing = false; $("btn-play").textContent = "▶"; mascotAnim("sleep"); stopLyrics(); } });
audio.addEventListener("ended", () => { if (state.queue.length) loadTrack(state.cur + 1); });
audio.addEventListener("error", () => {
  if (!audio.src) return;
  echo("<span class='p'>⏺</span> 该曲目可能需要登录/会员权限（Tauri 版登录后解锁）", "err");
});
audio.addEventListener("timeupdate", () => {
  if (!state.seekable || !audio.duration) return;
  $("p-fill").style.width = (audio.currentTime / audio.duration * 100) + "%";
  $("time-cur").textContent = fmt(audio.currentTime) + " / " + fmt(audio.duration);
  syncLrc();
});

/* ==================== 搜索 ==================== */
const DEMO_TRACKS = [
  { id: 400876427, name: "Try", artist: "周杰伦", album: "功夫熊猫3 主题曲", outer: "https://music.163.com/song/media/outer/url?id=400876427.mp3" },
  { id: 288750, name: "山歌好比春江水.多谢了 (Live)", artist: "李健", album: "歌手", outer: "https://music.163.com/song/media/outer/url?id=288750.mp3" },
  { id: 288820, name: "结尾曲 - 友谊地久天长 (Live)", artist: "群星", album: "歌手", outer: "https://music.163.com/song/media/outer/url?id=288820.mp3" },
];
async function neteaseSearch(q) {
  try {
    const r = await fetch("https://music.163.com/api/search/get?s=" + encodeURIComponent(q) + "&type=1&limit=25", { signal: AbortSignal.timeout(6000) });
    const d = await r.json();
    let songs = ((d.result && d.result.songs) || []).map(s => ({
      id: s.id, name: s.name, src: "netease",
      artist: (s.artists || []).map(a => a.name).join("/"),
      album: s.album ? s.album.name : "",
      outer: "https://music.163.com/song/media/outer/url?id=" + s.id + ".mp3",
    }));
    // 模糊兜底: 主搜索为空时走 suggest 接口(对拼写残缺更宽容)
    if (!songs.length) {
      const r2 = await fetch("https://music.163.com/api/search/suggest/web?s=" + encodeURIComponent(q), { signal: AbortSignal.timeout(6000) });
      const d2 = await r2.json();
      songs = ((d2.result && d2.result.songs) || []).map(s => ({
        id: s.id, name: s.name, src: "netease",
        artist: (s.artists || []).map(a => a.name).join("/"),
        album: s.album ? s.album.name : "",
        outer: "https://music.163.com/song/media/outer/url?id=" + s.id + ".mp3",
      }));
      if (songs.length) toastLike("精确匹配为空，已用模糊匹配 " + songs.length + " 首", "dim");
    }
    return songs;
  } catch (e) { return null; }
}

/* QQ 音乐搜索(免登录可搜, 播放需登录) */
async function qqSearch(q) {
  try {
    const r = await fetch("https://c.y.qq.com/soso/fcgi-bin/client_search_cp?w=" + encodeURIComponent(q) + "&format=json&n=15", { signal: AbortSignal.timeout(6000) });
    const d = await r.json();
    return (((d.data || {}).song || {}).list || []).map(s => ({
      name: s.songname, src: "qq",
      artist: (s.singer || []).map(a => a.name).join("/"),
      album: s.albumname || "",
      vip: (s.pay || {}).payplay !== 0,
    }));
  } catch (e) { return []; }
}

/* 模糊相关度: 子序列匹配(不要求连续), 前缀/完整命中加分 */
function fuzzyScore(needle, hay) {
  const n = needle.toLowerCase().replace(/\s+/g, ""), h = hay.toLowerCase();
  if (!n) return 0;
  if (h.includes(n)) return 100 + (h.startsWith(n) ? 20 : 0) - Math.min(30, h.indexOf(n));
  let i = 0;
  for (const ch of h) { if (ch === n[i]) i++; if (i >= n.length) break; }
  return i >= n.length ? 40 - (h.length - n.length) * 0.1 : -1;
}
function rankByRelevance(q, list) {
  return list
    .map(s => ({ s, v: Math.max(fuzzyScore(q, s.name + " " + s.artist), fuzzyScore(q, s.artist + " " + s.name)) }))
    .filter(x => x.v >= 0)
    .sort((a, b) => b.v - a.v)
    .map(x => x.s);
}
async function radioSearch(q) {
  try {
    const r = await fetch("https://de1.api.radio-browser.info/json/stations/search?name=" + encodeURIComponent(q) + "&limit=15&hidebroken=true&order=votes&reverse=true", { signal: AbortSignal.timeout(6000) });
    return (await r.json()).map(s => ({
      name: s.name.trim(), artist: s.country + " · " + (s.tags || "").split(",").slice(0,2).join("/"),
      url: s.url_resolved || s.url, country: s.country,
    }));
  } catch (e) { return []; }
}
function renderRows(list, isRadio) {
  document.querySelectorAll("#out .row").forEach(el => el.remove());
  list.forEach((t, i) => {
    const tag = isRadio ? "● LIVE" : (t.src === "qq" ? "QQ·需登录" : "网易 MP3");
    const d = document.createElement("div");
    d.className = "row"; d.dataset.i = i;
    d.innerHTML = '<span class="idx">' + String(i+1).padStart(2,"0") + '</span><span class="nm">' + esc(t.name) + '</span><span class="ar">' + esc(t.artist || "") + '</span><span class="tg' + (isRadio ? " live" : "") + '">' + tag + '</span>';
    d.addEventListener("click", () => {
      if (t.src === "qq") { echo("<span class='p'>⏺</span> QQ 音乐播放需先登录（登录功能开发中），先听网易云版本吧", "err"); return; }
      loadTrack(i);
    });
    out.insertBefore(d, $("eq"));
  });
  out.scrollTop = out.scrollHeight;
}
async function doPlay(q) {
  toastLike("模糊搜索「" + q + "」…");
  let songs = await neteaseSearch(q);
  if (songs === null) echo("<span class='p'>⏺</span> 网易云搜索通道异常（可输入 diag 自检）", "err");
  if (songs && songs.length) songs = rankByRelevance(q, songs);
  if (songs && songs.length) {
    const qq = await qqSearch(q);
    const merged = songs.concat(rankByRelevance(q, qq).slice(0, 8));
    state.queue = merged; renderRows(merged, false); loadTrack(0);
    return;
  }
  const radios = await radioSearch(q);
  if (radios.length) {
    toastLike(songs === null ? "搜索通道受限，切电台模式" : "没找到歌曲，为你找到相关电台", "dim");
    state.queue = radios; renderRows(radios, true); loadTrack(0);
  } else { echo("<span class='p'>⏺</span> 没找到「" + esc(q) + "」", "err"); }
}
async function doDiag() {
  echo("<span class='p'>diag</span> 运行环境: " + (window.__CM_IS_TAURI__ ? "Tauri 桌面版" : "浏览器预览"));
  try {
    const r = await fetch("https://music.163.com/api/search/get?s=test&type=1&limit=1");
    const j = await r.json();
    echo("网易云搜索通道: " + (j.result ? "正常" : "异常 code=" + j.code), j.result ? "ok" : "err");
  } catch (e) { echo("网易云搜索通道: 失败 " + esc(String(e)), "err"); }
  try {
    const r2 = await fetch("https://music.163.com/song/media/outer/url?id=400876427.mp3");
    echo("音频外链通道: HTTP " + r2.status, r2.ok ? "ok" : "err");
  } catch (e) { echo("音频外链通道: 失败 " + esc(String(e)), "err"); }
  try {
    const r3 = await fetch("https://c.y.qq.com/soso/fcgi-bin/client_search_cp?w=test&format=json&n=1");
    const j3 = await r3.json();
    echo("QQ搜索通道: " + (j3.code === 0 ? "正常" : "异常 code=" + j3.code), j3.code === 0 ? "ok" : "err");
  } catch (e) { echo("QQ搜索通道: 失败 " + esc(String(e)), "err"); }
}
async function doRadio(q) {
  toastLike("搜索电台「" + q + "」…");
  const radios = await radioSearch(q);
  if (!radios.length) { echo("<span class='p'>⏺</span> 没找到相关电台", "err"); return; }
  toastLike("Radio Browser → " + radios.length + " 个电台", "ok");
  state.queue = radios; renderRows(radios, true); loadTrack(0);
}

/* ==================== 进度/音量 ==================== */
function bindBar(barEl, cb) {
  const apply = (e) => { const r = barEl.getBoundingClientRect(); cb(Math.max(0, Math.min(1, (e.clientX - r.left) / r.width))); };
  barEl.addEventListener("mousedown", (e) => {
    apply(e);
    const mv = (ev) => apply(ev);
    const up = () => { document.removeEventListener("mousemove", mv); document.removeEventListener("mouseup", up); };
    document.addEventListener("mousemove", mv); document.addEventListener("mouseup", up);
  });
}
bindBar($("progress-bar"), (p) => { if (state.seekable && audio.duration) audio.currentTime = p * audio.duration; });
function setVol(v) {
  state.vol = Math.max(0, Math.min(1, v));
  audio.volume = state.vol;
  $("v-fill").style.width = state.vol * 100 + "%"; $("vol-num").textContent = Math.round(state.vol * 100);
}
bindBar($("vol-bar"), setVol);

$("btn-play").addEventListener("click", () => {
  if (!audio.src) { execCmd("demo"); return; }
  if (audio.paused) { audio.play().catch(()=>{}); } else audio.pause();
});
$("btn-next").addEventListener("click", () => { if (state.queue.length) loadTrack(state.cur + 1); });
$("btn-prev").addEventListener("click", () => { if (state.queue.length) loadTrack(state.cur - 1); });

/* ==================== 命令 ==================== */
function execCmd(raw) {
  const s = raw.trim(); if (!s) return;
  echo("<span class='p'>&gt;</span> " + esc(s));
  const [cmd, ...rest] = s.split(/\s+/); const arg = rest.join(" ");
  switch (cmd.toLowerCase()) {
    case "play": arg ? doPlay(arg) : toastLike("用法: play <关键词>", "dim"); break;
    case "radio": doRadio(arg || "华语"); break;
    case "next": $("btn-next").click(); break;
    case "prev": $("btn-prev").click(); break;
    case "pause": audio.pause(); break;
    case "resume": audio.play().catch(()=>{}); break;
    case "vol": { const v = parseFloat(arg); if (!isNaN(v)) setVol(v/100); break; }
    case "clear": document.querySelectorAll("#out .ln, #out .row, .lyric-line").forEach(el => { if (el.id !== "eq" && !el.contains($("eq"))) el.remove(); }); break;
    case "mood": {
      const map = { "欢快": "excited", "excited": "excited", "平静": "calm", "calm": "calm", "忧郁": "melancholy", "sad": "melancholy", "高潮": "peak", "peak": "peak" };
      if (arg === "auto" || !arg) { moodAuto = true; $("mood-src").textContent = "(auto)"; toastLike("情绪自动识别已开启", "ok"); }
      else if (map[arg]) { moodAuto = false; setMood(map[arg], "(手动)"); }
      else toastLike("用法: mood auto|欢快|平静|忧郁|高潮", "dim");
      break;
    }
    case "demo": state.queue = DEMO_TRACKS.slice(); renderRows(DEMO_TRACKS, false); loadTrack(0); break;
    case "diag": doDiag(); break;
    case "lyric":
      lyricMode = !(arg === "off");
      if (!lyricMode) stopLyrics();
      toastLike("字幕显示: " + (lyricMode ? "开" : "关"), "ok");
      break;
    case "help":
      echo("<span class='p'>命令</span> play &lt;词&gt; · radio &lt;名&gt; · next · prev · pause · vol 0-100 · mood auto|欢快|平静|忧郁|高潮 · lyric on|off · demo · diag · clear", "dim"); break;
    default: doPlay(s);
  }
}
$("cmd").addEventListener("keydown", (e) => { if (e.key === "Enter") { execCmd(e.target.value); e.target.value = ""; } });
document.addEventListener("keydown", (e) => {
  if (e.key === "m" && document.activeElement !== $("cmd")) {
    const i = MOOD_KEYS.indexOf(moodAuto ? "auto" : moodCur);
    const nextKey = MOOD_KEYS[(i + 1) % MOOD_KEYS.length];
    execCmd("mood " + nextKey);
  }
});
setTimeout(() => echo("<span class='p'>Claude:</span> 嗨，我是你的音乐搭子。放一首歌试试？", "dim"), 700);

/* ==================== 内置工具 API（供扩展/调试） ==================== */
/* window.ClaudeTools.mood  — 情绪分析: get()/set()/list()
   window.ClaudeTools.lyric — 字幕引擎: fetchLrc/parseLrc/colorize/syncLrc */
window.ClaudeTools = {
  mood: {
    get: () => ({ mood: moodCur, auto: moodAuto, name: MOODS[moodCur].name }),
    set: (k) => execCmd("mood " + k),
    auto: (v) => { moodAuto = !!v; },
  },
  lyric: {
    fetchLrc, parseLrc, colorize,
    toggle: (v) => execCmd("lyric " + (v ? "on" : "off")),
  },
  env: () => ({ tauri: window.__CM_IS_TAURI__ }),
};
</script>
